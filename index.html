<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آژانس مسافربری سخاوت</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, 'Segoe UI', Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            line-height: 1.8;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        /* بنر و عکس اصلی */
        .hero {
            position: relative;
            width: 100%;
            height: 320px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
            background-color: #e2e8f0;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            background: linear-gradient(transparent, rgba(15, 23, 42, 0.85));
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        .hero-overlay h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .hero-overlay p {
            font-size: 1.1rem;
            color: #f1f5f9;
        }

        /* کارت‌ها */
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .card h2 {
            color: #0284c7;
            margin-bottom: 16px;
            font-size: 1.3rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        .address-box {
            font-size: 1.1rem;
            background-color: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            border-right: 4px solid #0284c7;
            margin-bottom: 10px;
        }

        /* لیست شماره تلفن‌ها */
        .phone-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .phone-item {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .phone-number {
            font-weight: bold;
            font-size: 1.1rem;
            color: #0f172a;
            direction: ltr;
        }

        /* دکمه‌های تماس */
        .btn {
            display: inline-block;
            background-color: #f97316;
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            background-color: #ea580c;
        }

        /* فوتر */
        footer {
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="hero">
        <img src="./1788290937456.jpg" alt="آژانس مسافربری سخاوت">
        <div class="hero-overlay">
            <h1>آژانس مسافربری سخاوت</h1>
            <p>درون شهر و بیرون شهر شبانه روزی</p>
        </div>
    </div>

    <div class="card">
        <h2>📍 آدرس آژانس</h2>
        <div class="address-box">
            آژانس سخاوت حاجی آباد هرمزگان
        </div>
    </div>

    <div class="card">
        <h2>📞 شماره‌های تماس و پشتیبانی</h2>
        <div class="phone-list">
            
            <div class="phone-item">
                <span class="phone-number">076-35425151</span>
                <a href="tel:07635425151" class="btn">تماس تلفنی</a>
            </div>

            <div class="phone-item">
                <span class="phone-number">076-35423636</span>
                <a href="tel:07635423636" class="btn">تماس تلفنی</a>
            </div>

            <div class="phone-item">
                <span class="phone-number">076-35423737</span>
                <a href="tel:07635423737" class="btn">تماس تلفنی</a>
            </div>

            <div class="phone-item">
                <span class="phone-number">09170969004</span>
                <a href="tel:09170969004" class="btn">تماس مستقیم (همراه)</a>
            </div>

        </div>
    </div>

    <footer>
        © تمامی حقوق برای آژانس مسافربری سخاوت محفوظ است.
    </footer>

</div>

</body>
</html>
